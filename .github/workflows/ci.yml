name: CI

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build with VitePress
        run: |
          npm run docs:build
